version: "1"
matches:
  - name: test-1
    route:
      path: "/test/:topic"
      method: GET
    out:
      - type: amqp
        uri: "amqp://guest:guest@localhost:5672/"
        topic: "{{ route.topic }}"
        message: |
          {
            "test": "{{ query.q }}"
          }

  - name: kakfa-test
    route:
      path: "/kafka/:topic"
      method: POST
    out:
      - type: kafka
        uri: "localhost:9092"
        topic: "orders.{{ route.topic }}"
        key: "{{ json.customer_id }}"
        message: '{"order": {{ json.id | json }}, "customer": {{ json.customer | json }}}'
